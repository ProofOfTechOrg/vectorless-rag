{{- define "vectorless-rag.langfuseEnv" }}
- name: DATABASE_URL
  valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: langfuse-database-url}}
- {name: CLICKHOUSE_URL, value: "http://{{ include "vectorless-rag.clickhouseHost" . }}:{{ .Values.clickhouse.httpPort }}"}
- {name: CLICKHOUSE_MIGRATION_URL, value: "clickhouse://{{ include "vectorless-rag.clickhouseHost" . }}:{{ .Values.clickhouse.nativePort }}"}
- {name: CLICKHOUSE_USER, value: clickhouse}
- {name: CLICKHOUSE_CLUSTER_ENABLED, value: {{ .Values.clickhouse.clusterEnabled | quote }}}
- name: CLICKHOUSE_PASSWORD
  valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: clickhouse-password}}
- {name: REDIS_HOST, value: {{ include "vectorless-rag.redisHost" . | quote }}}
- {name: REDIS_PORT, value: {{ .Values.redis.port | quote }}}
- {name: REDIS_SOCKET_TIMEOUT_MS, value: "0"}
- name: REDIS_AUTH
  valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: redis-password}}
- {name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET, value: langfuse}
- {name: LANGFUSE_S3_EVENT_UPLOAD_REGION, value: us-east-1}
- {name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT, value: {{ include "vectorless-rag.s3Endpoint" . | quote }}}
- {name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE, value: "true"}
- name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
  valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: s3-access-key}}
- name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
  valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: s3-secret-key}}
- name: SALT
  valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: langfuse-salt}}
- name: ENCRYPTION_KEY
  valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: langfuse-encryption-key}}
- {name: TELEMETRY_ENABLED, value: "false"}
{{- end }}
{{- if .Values.langfuse.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "vectorless-rag.fullname" . }}-langfuse-web}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/component: langfuse-web, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/component: langfuse-web, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      containers:
        - name: web
          image: {{ .Values.langfuse.webImage }}
          ports: [{name: http, containerPort: 3000}]
          env:
            {{- include "vectorless-rag.langfuseEnv" . | nindent 12 }}
            - name: NEXTAUTH_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: langfuse-nextauth-secret}}
          readinessProbe: {httpGet: {path: /api/public/health, port: http}, initialDelaySeconds: 20, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/public/health, port: http}, initialDelaySeconds: 40, periodSeconds: 20}
          resources: {{- toYaml .Values.langfuse.resources | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "vectorless-rag.fullname" . }}-langfuse-worker}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/component: langfuse-worker, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/component: langfuse-worker, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      containers:
        - name: worker
          image: {{ .Values.langfuse.workerImage }}
          env: {{- include "vectorless-rag.langfuseEnv" . | nindent 12 }}
          resources: {{- toYaml .Values.langfuse.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: {name: {{ include "vectorless-rag.fullname" . }}-langfuse}
spec:
  selector: {app.kubernetes.io/component: langfuse-web, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: 3000, targetPort: http}]
{{- end }}

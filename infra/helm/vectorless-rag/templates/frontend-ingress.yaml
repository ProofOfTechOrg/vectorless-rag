{{- if .Values.frontendIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vectorless-rag.fullname" . }}-web
  annotations: {{- toYaml .Values.frontendIngress.annotations | nindent 4 }}
spec:
  {{- with .Values.frontendIngress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.frontendIngress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ include "vectorless-rag.fullname" . }}-web, port: {name: http}}
  {{- with .Values.frontendIngress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

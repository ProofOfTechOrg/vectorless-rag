name: vectorless-rag

x-logging: &default-logging
  driver: local
  options:
    max-size: 20m
    max-file: "5"

x-app-env: &app-env
  ENVIRONMENT: ${ENVIRONMENT}
  RELEASE: ${RELEASE}
  DATABASE_URL: postgresql+psycopg://rag_app:${RAG_APP_PASSWORD}@postgres:5432/rag
  DATABASE_ADMIN_URL: postgresql+psycopg://rag_owner:${RAG_OWNER_PASSWORD}@postgres:5432/rag
  SQL_DATABASE_URL: postgresql+psycopg://rag_reader:${RAG_READER_PASSWORD}@postgres:5432/rag
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL}
  DEEPSEEK_INPUT_COST_PER_MILLION_USD: ${DEEPSEEK_INPUT_COST_PER_MILLION_USD}
  DEEPSEEK_CACHE_HIT_INPUT_COST_PER_MILLION_USD: ${DEEPSEEK_CACHE_HIT_INPUT_COST_PER_MILLION_USD}
  DEEPSEEK_OUTPUT_COST_PER_MILLION_USD: ${DEEPSEEK_OUTPUT_COST_PER_MILLION_USD}
  PAGEINDEX_MODEL: ${PAGEINDEX_MODEL}
  PAGEINDEX_LLM_MAX_ATTEMPTS: ${PAGEINDEX_LLM_MAX_ATTEMPTS:-3}
  PAGEINDEX_ASYNC_CONCURRENCY: ${PAGEINDEX_ASYNC_CONCURRENCY:-8}
  PAGEINDEX_MAX_OUTPUT_TOKENS: ${PAGEINDEX_MAX_OUTPUT_TOKENS:-8192}
  QUERY_NODE_SELECTION_MAX_OUTPUT_TOKENS: ${QUERY_NODE_SELECTION_MAX_OUTPUT_TOKENS:-4096}
  PAGEINDEX_CALL_TIMEOUT_SECONDS: ${PAGEINDEX_CALL_TIMEOUT_SECONDS:-120}
  PAGEINDEX_TIMEOUT_SECONDS: ${PAGEINDEX_TIMEOUT_SECONDS:-3600}
  INGESTION_MAX_ATTEMPTS: ${INGESTION_MAX_ATTEMPTS:-3}
  INGESTION_LEASE_SECONDS: ${INGESTION_LEASE_SECONDS:-120}
  INGESTION_HEARTBEAT_SECONDS: ${INGESTION_HEARTBEAT_SECONDS:-30}
  INGESTION_STALE_GRACE_SECONDS: ${INGESTION_STALE_GRACE_SECONDS:-300}
  CATALOG_BATCH_TOKEN_LIMIT: ${CATALOG_BATCH_TOKEN_LIMIT:-24000}
  DOCUMENT_LIMIT: ${DOCUMENT_LIMIT:-8}
  EVIDENCE_TOKEN_LIMIT: ${EVIDENCE_TOKEN_LIMIT:-40000}
  REQUEST_DEADLINE_SECONDS: ${REQUEST_DEADLINE_SECONDS:-180}
  ARXIV_PDF_DIR: /corpus
  PAGEINDEX_WORK_DIR: /workspaces
  OBJECT_STORE_ENDPOINT: http://minio:9000
  OBJECT_STORE_ACCESS_KEY: ${MINIO_ROOT_USER}
  OBJECT_STORE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  OBJECT_STORE_BUCKET: vectorless-rag
  LANGFUSE_HOST: http://langfuse-web:3000
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
  API_KEY_PEPPER: ${API_KEY_PEPPER}
  PILOT_DOCUMENT_LIMIT: ${PILOT_DOCUMENT_LIMIT}
  PILOT_COST_LIMIT_USD: ${PILOT_COST_LIMIT_USD:-10}
  ALLOW_FULL_CORPUS_INDEX: ${ALLOW_FULL_CORPUS_INDEX}

x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@postgres:5432/langfuse
  NEXTAUTH_URL: ${NEXTAUTH_URL}
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: ${CLICKHOUSE_USER}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: ${CLICKHOUSE_CLUSTER_ENABLED}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_AUTH: ${REDIS_PASSWORD}
  REDIS_SOCKET_TIMEOUT_MS: "0"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  TELEMETRY_ENABLED: "false"

services:
  api:
    logging: *default-logging
    build:
      context: ./apps/api
      args:
        RELEASE: ${RELEASE}
    restart: unless-stopped
    command: ["sh", "-c", "vectorless-rag migrate && uvicorn vectorless_rag.api:app --host 0.0.0.0 --port 8000"]
    environment: *app-env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${ARXIV_PDF_HOST_DIR}:/corpus:ro
      - pageindex_work:/workspaces
      # The evaluation plan is written on the host and executed in here, because the
      # executor needs the object store, which is not published outside the network. The
      # mount also stops evaluation-freeze reading a baked corpus manifest that has since
      # moved on. Run the execute target as the host user so appends land as that user.
      - ./apps/api/evaluation:/app/evaluation
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    logging: *default-logging
    build:
      context: ./apps/api
      args:
        RELEASE: ${RELEASE}
    restart: unless-stopped
    command: ["python", "-m", "vectorless_rag.worker"]
    environment: *app-env
    volumes:
      - ${ARXIV_PDF_HOST_DIR}:/corpus:ro
      - pageindex_work:/workspaces
    depends_on:
      api:
        condition: service_healthy

  postgres:
    logging: *default-logging
    image: postgres:17.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      RAG_OWNER_PASSWORD: ${RAG_OWNER_PASSWORD}
      RAG_APP_PASSWORD: ${RAG_APP_PASSWORD}
      RAG_READER_PASSWORD: ${RAG_READER_PASSWORD}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  langfuse-web:
    logging: *default-logging
    image: langfuse/langfuse:3.221.1
    restart: unless-stopped
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
    ports:
      - "3000:3000"
    depends_on: &langfuse-depends
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  langfuse-worker:
    logging: *default-logging
    image: langfuse/langfuse-worker:3.221.1
    restart: unless-stopped
    environment: *langfuse-env
    depends_on: *langfuse-depends

  clickhouse:
    logging: *default-logging
    image: clickhouse/clickhouse-server:25.8.28.1
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT}:9000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    logging: *default-logging
    image: redis:7.4.9-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    logging: *default-logging
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command: ["mkdir -p /data/vectorless-rag /data/langfuse && minio server --console-address :9001 /data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    logging: *default-logging
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      VECTORLESS_API_URL: http://api:8000
      APP_ORIGIN: ${APP_ORIGIN}
      SESSION_SECRET: ${SESSION_SECRET}
      PORT: 3001
      HOST: 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "apps/web/scripts/verify-production-assets.mjs", "http://127.0.0.1:3001"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  redis_data:
  minio_data:
  pageindex_work:

[project]
name = "vectorless-rag"
version = "0.3.0"
description = "Self-hosted vectorless RAG for grounded question answering over local PDFs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "ProofOfTechOrg", email = "hello@proofoftech.org" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "alembic==1.18.5",
  "boto3==1.43.51",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "langchain==1.3.14",
  "langchain-deepseek==1.1.0",
  "langfuse==4.14.0",
  "langgraph==1.2.9",
  "langgraph-checkpoint-postgres==3.1.0",
  "litellm==1.93.0",
  "orjson==3.11.9",
  "psycopg[binary,pool]==3.3.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "pymupdf==1.28.0",
  "pypdf==6.15.0",
  "python-dotenv==1.2.2",
  "python-multipart==0.0.32",
  "pyyaml==6.0.3",
  "sqlalchemy[asyncio]==2.0.51",
  "sqlglot==30.12.0",
  "sse-starlette==3.4.5",
  "tenacity==9.1.4",
  "tiktoken==0.13.0",
  "typer==0.27.0",
  "uvicorn[standard]==0.51.0",
]

[project.scripts]
vectorless-rag = "vectorless_rag.cli:app"

[project.urls]
Homepage = "https://github.com/ProofOfTechOrg/vectorless-rag"
Repository = "https://github.com/ProofOfTechOrg/vectorless-rag"
Issues = "https://github.com/ProofOfTechOrg/vectorless-rag/issues"

[dependency-groups]
dev = [
  "basedpyright==1.39.9",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.15.22",
  "types-boto3[s3]==1.43.51",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vectorless_rag"]

[tool.uv]
required-version = ">=0.9.17"
exclude-newer = "7 days"

[tool.uv.exclude-newer-package]
boto3 = false
botocore = false
coverage = false
fastapi = false
filelock = false
hf-xet = false
huggingface-hub = false
langchain = false
langsmith = false
litellm = false
openai = false
opentelemetry-api = false
opentelemetry-exporter-otlp-proto-common = false
opentelemetry-exporter-otlp-proto-http = false
opentelemetry-proto = false
opentelemetry-sdk = false
opentelemetry-semantic-conventions = false
regex = false
ruff = false
tqdm = false
typer = false
types-boto3 = false
types-boto3-s3 = false

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires local PostgreSQL and migrated schema"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.basedpyright]
include = ["."]
typeCheckingMode = "strict"
pythonVersion = "3.12"
pythonPlatform = "Linux"
venvPath = "."
venv = ".venv"
failOnWarnings = true
allowedUntypedLibraries = ["fitz", "langgraph"]

[project]
name = "vectorless-rag"
version = "0.1.0"
description = "Self-hosted vectorless RAG over a local ArXiv corpus"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.18.5",
  "boto3==1.43.51",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "langchain==1.3.14",
  "langchain-deepseek==1.1.0",
  "langfuse==4.14.0",
  "langgraph==1.2.9",
  "langgraph-checkpoint-postgres==3.1.0",
  "litellm==1.93.0",
  "orjson==3.11.9",
  "psycopg[binary,pool]==3.3.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "pymupdf==1.28.0",
  "pypdf2==3.0.1",
  "python-dotenv==1.2.2",
  "python-multipart==0.0.32",
  "pyyaml==6.0.3",
  "sqlalchemy[asyncio]==2.0.51",
  "sqlglot==30.12.0",
  "sse-starlette==3.4.5",
  "tenacity==9.1.4",
  "tiktoken==0.13.0",
  "typer==0.27.0",
  "uvicorn[standard]==0.51.0",
]

[project.scripts]
vectorless-rag = "vectorless_rag.cli:app"

[dependency-groups]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.15.22",
  "types-boto3[s3]==1.43.51",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vectorless_rag"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires local PostgreSQL and migrated schema"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
packages = ["vectorless_rag"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["langfuse.*", "langgraph.*", "boto3.*", "botocore.*", "fitz.*"]
ignore_missing_imports = true
